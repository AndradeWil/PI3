{% extends 'base.html' %}
{% block title %}Login | PhysioManage{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="card border-0 shadow">
            <div class="card-body">
                <div class="auth-header">
                    <h1>Bem-vindo ao PhysioManage</h1>
                    <p>Entre com suas credenciais para acessar a plataforma.</p>
                </div>
                <form method="post" class="form-grid">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
                </form>
                <hr class="my-3">
                <p class="text-center mb-0" style="font-size:.9rem">Não possui conta? <a href="{% url 'registro' %}" class="link-primary fw-semibold">Cadastre-se aqui</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
