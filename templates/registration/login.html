{% extends 'base.html' %}
{% block title %}Login | Controle Fisio{% endblock %}
{% block content %}
<section class="card">
    <h2>Entrar na plataforma</h2>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>
    <p>Nao possui conta? <a href="{% url 'registro' %}">Cadastre-se</a></p>
</section>
{% endblock %}
