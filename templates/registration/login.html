{% extends 'base.html' %}
{% block title %}Login | Controle Fisio{% endblock %}
{% block content %}
<section class="card border-0 shadow-sm card-narrow">
    <div class="card-body">
    <h2 class="h4 mb-3">Entrar na plataforma</h2>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <p class="mt-3 mb-0">Não possui conta? <a href="{% url 'registro' %}" class="link-primary fw-semibold">Cadastre-se</a></p>
    </div>
</section>
{% endblock %}
